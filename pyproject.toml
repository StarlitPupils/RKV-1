[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "rkv1"
version = "0.18.0"
description = "Reversible Knowledge Vault: auditable lossless scientific memory experiments"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.optional-dependencies]
bench = ["zstandard==0.24.0", "Brotli==1.1.0"]
zstd = ["zstandard==0.24.0"]
scientific = ["zstandard==0.24.0", "blosc==1.11.4"]
plots = ["matplotlib==3.10.9"]

[project.scripts]
rkv1 = "rkv1.cli:main"

[tool.setuptools.packages.find]
include = ["rkv1*"]

[tool.setuptools.package-data]
rkv1 = ["*.html"]
