[package]
name = "rkv1-postings"
version = "0.60.0"
edition = "2021"
license = "MIT"
description = "Experimental allocation-free canonical unsigned-varint batch reader"

[lib]
path = "src/lib.rs"
crate-type = ["cdylib"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
