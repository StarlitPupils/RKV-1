<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>RKV · 证据记忆</title>
<style>
:root{font-family:system-ui,"Microsoft YaHei",sans-serif;color:#15252d;background:#f3f5f2}*{box-sizing:border-box}body{margin:0}main{max-width:1080px;margin:0 auto;padding:42px 24px}header{display:flex;align-items:center;justify-content:space-between;gap:20px}.brand{font-size:14px;letter-spacing:.12em;color:#426b60;font-weight:700}h1{font-size:36px;letter-spacing:-.04em;margin:14px 0}p{line-height:1.7;color:#52616a}.badge{border:1px solid #c2d9cc;border-radius:30px;padding:9px 15px;color:#245d49;background:#e4eee6;font-size:13px}.panel{background:white;border:1px solid #dce4de;border-radius:18px;padding:24px;margin:24px 0;box-shadow:0 6px 24px #20382805}label{display:block;font-weight:650;margin-bottom:12px}textarea{width:100%;min-height:110px;border:1px solid #c7d2ca;border-radius:10px;padding:15px;font:inherit;line-height:1.5;resize:vertical}textarea:focus{outline:2px solid #79ad95}button{font:inherit;border:0;border-radius:9px;padding:12px 20px;background:#1e6650;color:white;cursor:pointer}button.secondary{background:#edf2ee;color:#254a3b}button:disabled{opacity:.45;cursor:wait}.actions{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:16px}.muted{font-size:13px;color:#6a7971}.columns{display:grid;grid-template-columns:1.35fr 1fr;gap:24px}.columns .panel{margin-top:0}h2{font-size:18px;margin-top:0}.hit{padding:18px 0;border-top:1px solid #e5ebe5}.hit:first-of-type{border-top:0}.hit h3{font-size:15px;line-height:1.5;margin:6px 0}.quote{font-size:14px;line-height:1.7;white-space:pre-wrap;max-height:220px;overflow:auto}.tag{display:inline-block;font-size:11px;border-radius:4px;padding:4px 7px;background:#eef3ef;color:#37614e;margin-right:5px}#verdict{font-size:25px;font-weight:700;color:#235e47;margin:16px 0}#error{color:#9a4235;white-space:pre-wrap}details{margin-top:16px;font-size:12px;color:#627168}pre{white-space:pre-wrap;word-break:break-all;font-size:11px}@media(max-width:720px){.columns{grid-template-columns:1fr}h1{font-size:28px}header{align-items:flex-start}}
</style>
<main><header><div><div class="brand">RKV / EVIDENCE MEMORY</div><h1>让回答回到原始证据</h1></div><span class="badge">本机证据库</span></header>
<p>输入一条科学主张，先找到论文摘要，再让模型据证判断。英文 SciFact 样例使用词法检索；本版不做跨语言语义检索。</p>
<section class="panel"><label for="question">待核验主张</label><textarea id="question">1,000 genomes project enables mapping of genetic sequence variation consisting of rare variants with larger penetrance effects than common variants.</textarea><div class="actions"><button id="search">检索证据</button><button id="answer" class="secondary">基于证据回答</button><span id="status" class="muted">正在读取本机证据库…</span></div><p id="error" hidden></p></section>
<div class="columns"><section class="panel"><h2>召回的原始资料</h2><div id="hits"><p class="muted">检索后显示来源、原句与可核验出处。</p></div></section><section class="panel"><h2>模型判断</h2><div id="verdict">等待问题</div><p id="explanation" class="muted">引用能绑定原文，不代表科学结论已被自动证明。</p><div id="citations"></div><details><summary>核验与记忆记录</summary><pre id="audit">模型回答单独作为派生记录保存，不进入原始证据索引。</pre></details></section></div>
<p class="muted" id="foot">原文按不可变快照保存；索引可以重建。更换资料使用 memory-add，旧快照仍可读取。</p></main>
<script>
const $=id=>document.getElementById(id);let modelReady=false;
function el(tag,text,cls){const e=document.createElement(tag);e.textContent=text;if(cls)e.className=cls;return e}
async function request(path,body){const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json','X-RKV-Client':'memory-v1'},body:JSON.stringify(body)});const j=await r.json();if(!r.ok)throw Error(j.error||'请求失败');return j}
function hits(j){$('hits').replaceChildren();if(!j.hits.length){$('hits').append(el('p','没有召回资料。请换用资料中的关键词。','muted'));return}for(const h of j.hits){const box=el('div','','hit');box.append(el('span',h.citation_id+' · '+h.key,'tag'),el('span','原始记录校验通过','tag'),el('h3',h.title));const text=h.sentences.map((s,i)=>'['+i+'] '+s).join('\n');box.append(el('div',text,'quote'));const d=el('details','');d.append(el('summary','查看原文定位'),el('pre',JSON.stringify(h.locator,null,2)));box.append(d);$('hits').append(box)}}
async function run(withModel){$('error').hidden=true;$('search').disabled=true;$('answer').disabled=true;$('status').textContent=withModel?'正在检索并请求模型…':'正在读取原始证据…';try{const question=$('question').value.trim();if(!question)throw Error('请输入主张');const found=await request('/api/search',{question});hits(found);if(withModel){const r=await request('/api/answer',{question});$('audit').textContent=JSON.stringify(r,null,2);$('citations').replaceChildren();if(!r.accepted){$('verdict').textContent='回答未通过校验';$('explanation').textContent=r.error||'请检查服务配置或响应格式。'}else{const a=r.answer;$('verdict').textContent=({SUPPORT:'证据支持',CONTRADICT:'证据反驳',INSUFFICIENT:'现有证据不足'})[a.verdict];$('explanation').textContent=a.explanation;for(const c of a.evidence)$('citations').append(el('p',c.citation_id+' · 原句 ['+c.sentence+'] · '+c.key,'muted'))}}$('status').textContent='完成 · '+found.hits.length+' 条原始记录';}catch(e){$('error').textContent=e.message;$('error').hidden=false;$('status').textContent='请求未完成';}finally{$('search').disabled=false;$('answer').disabled=!modelReady}}
$('search').onclick=()=>run(false);$('answer').onclick=()=>run(true);
fetch('/api/status').then(r=>r.json()).then(j=>{modelReady=!!j.model;$('answer').disabled=!modelReady;$('status').textContent=modelReady?'模型：'+j.model:'检索可用 · 尚未配置模型服务';$('foot').textContent+=' 当前保存 '+(j.memory.logical_file_bytes/1048576).toFixed(2)+' MiB（含索引、保留快照及派生记录）。'}).catch(()=>{$('status').textContent='无法读取证据库状态';$('answer').disabled=true});
</script></html>
