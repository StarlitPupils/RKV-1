name: tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  python:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install ".[scientific]"
      - run: python -m unittest discover -s tests -v
      - run: python -m rkv1 --version
  rust:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install ".[zstd]"
      - run: cargo test --manifest-path rust/Cargo.toml
      - run: cargo build --release --manifest-path rust/Cargo.toml
      - if: runner.os == 'Windows'
        run: python scripts/check_native.py rust/target/release/rkv1_core.dll
      - if: runner.os == 'Linux'
        run: python scripts/check_native.py rust/target/release/librkv1_core.so
      - if: runner.os == 'Windows'
        run: python scripts/native_metadata.py rust/target/release/rkv1_core.dll
      - if: runner.os == 'Linux'
        run: python scripts/native_metadata.py rust/target/release/librkv1_core.so
      - if: runner.os == 'Windows'
        env:
          RKV_NATIVE_LIBRARY: rust/target/release/rkv1_core.dll
        run: python -m unittest discover -s tests -p test_native.py -v
      - if: runner.os == 'Linux'
        env:
          RKV_NATIVE_LIBRARY: rust/target/release/librkv1_core.so
        run: python -m unittest discover -s tests -p test_native.py -v
      - uses: actions/upload-artifact@v4
        with:
          name: native-ci-${{ runner.os }}
          path: |
            rust/target/release/rkv1_core.dll
            rust/target/release/librkv1_core.so
            rust/target/release/native.json
